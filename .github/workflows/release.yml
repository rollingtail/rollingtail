name: Release Home Assistant Add-on

on:
  push:
    branches:
      - main
    paths:
      - '.env'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Tailscale Version
        id: extract_version
        run: |
          VERSION=$(grep -E '^TAILSCALE_VERSION=' .env | cut -d= -f2 | xargs)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted Tailscale version: $VERSION"

      - name: Update YAML files
        run: |
          python3 -c '
          import re
          import os
          
          version = os.environ["VERSION"]
          
          # Update config.yaml version field
          with open("platforms/home-assistant/tailscale/config.yaml", "r") as f:
              content = f.read()
          content = re.sub(r"(?m)^version:\s*.*$", f"version: \"{version}\"", content)
          with open("platforms/home-assistant/tailscale/config.yaml", "w") as f:
              f.write(content)
              
          # Update build.yaml args field
          with open("platforms/home-assistant/tailscale/build.yaml", "r") as f:
              content = f.read()
          if "args:" in content:
              content = re.sub(r"(?m)^\s*TAILSCALE_VERSION:\s*.*$", f"  TAILSCALE_VERSION: \"{version}\"", content)
          else:
              content += f"\nargs:\n  TAILSCALE_VERSION: \"{version}\"\n"
          with open("platforms/home-assistant/tailscale/build.yaml", "w") as f:
              f.write(content)
          '

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify aarch64 Build
        uses: docker/build-push-action@v6
        with:
          context: tailscale
          platforms: linux/arm64
          build-args: |
            TAILSCALE_VERSION=${{ env.VERSION }}
            BUILD_ARCH=aarch64
            BUILD_FROM=ghcr.io/hassio-addons/base/aarch64:21.0.2
          push: false

      - name: Verify amd64 Build
        uses: docker/build-push-action@v6
        with:
          context: tailscale
          platforms: linux/amd64
          build-args: |
            TAILSCALE_VERSION=${{ env.VERSION }}
            BUILD_ARCH=amd64
            BUILD_FROM=ghcr.io/hassio-addons/base/amd64:21.0.2
          push: false

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add platforms/home-assistant/tailscale/config.yaml platforms/home-assistant/tailscale/build.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "release: update Home Assistant addon to version ${{ env.VERSION }} [skip ci]"
            git push origin main
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ env.VERSION }}"
          # Check if tag already exists to avoid failing
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists."
          else
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --notes "Automated release of Tailscale Home Assistant addon version ${{ env.VERSION }}. See the [official Tailscale changelog](https://tailscale.com/changelog) for release details."
          fi
